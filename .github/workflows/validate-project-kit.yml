name: Validate AI project kit
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project manifests and links
        run: python scripts/validate_project_kit_v241.py

      - name: Test offline PII redaction
        run: python -m unittest discover -s scripts -p 'test_pii_redact.py' -v
      - name: Check public source files for obvious PII
        run: python scripts/check_public_repo_pii.py

      - name: Validate standalone educator form
        run: python scripts/test_form_static.py
